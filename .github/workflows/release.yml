name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: mkdir -p release && npm pack --pack-destination release

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/expaudit-cli-*.tgz
